# G-08 contract-to-test mapping for the CPU foundation.
#
# Every ID in the `CPU clause catalogue` of docs/CPU-CHECKS.md maps to the tests that carry its
# evidence. A selector is `rust:<nextest binary-id>::<test name>` or `python:<root-relative
# pytest node ID>`; a Python function selector also covers its collected parameter instances.
#
# This mapping is traceability, not proof: it says which tests claim a clause, and the CPU
# runner separately requires those suites to pass. Judging whether the assertions are sufficient
# stays with review.

schema = 1
scope = "cpu-foundation"

# No kernel evidence exists yet. A nonempty list, or any tracked `*_kernel.rs`, fails the
# CPU-only checker until the GPU manifest contract is written.
kernel_specializations = []

